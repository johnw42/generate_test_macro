[package]
name = "generate_test_macro"
version = "0.1.5"
edition = "2021"
description = "A proc macro for writing test suites as methods on a struct, generating a macro_rules! macro to instantiate each test individually."
repository = "https://github.com/johnw42/generate_test_macro"
license = "MIT OR Apache-2.0"
keywords = [
  "test",
  "macro",
  "proptest",
  "quickcheck",
]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = [
  "full",
] }

[dev-dependencies]
proptest = "1.11.0"
quickcheck = "1.0"
trybuild = "1.0.122"
